name: AMO · Target Client

on:
  pull_request:
    paths:
      - 'src/client/**'
      - 'src/demand/**'
      - 'tests/target-client-*.test.js'
      - 'worker.js'
      - '.github/workflows/target-client.yml'
  push:
    branches:
      - main
    paths:
      - 'src/client/**'
      - 'src/demand/**'
      - 'tests/target-client-*.test.js'
      - 'worker.js'
      - '.github/workflows/target-client.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate target client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate route and canonical modules
        shell: bash
        run: |
          set -euo pipefail
          node --check worker.js
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find src/client src/demand -name '*.js' -print0)

      - name: Run target-client domain and architecture tests
        run: node tests/target-client-demand.test.js
