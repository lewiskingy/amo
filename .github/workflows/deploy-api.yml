name: Build and deploy AMO API

on:
  pull_request:
    paths:
      - 'server/**'
      - 'infra/**'
      - '.github/workflows/deploy-api.yml'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'infra/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: amo-api
  API_HOSTNAME: api.amo.theflat.me.uk
  CONTAINER_APP_ENVIRONMENT: amo-env

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bicep syntax
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Build API image
        run: docker build -f server/Dockerfile -t amo-api:${{ github.sha }} .

  deploy:
    name: Deploy to Azure Container Apps
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: prod-amo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure required Azure resource providers
        shell: bash
        run: |
          set -euo pipefail
          providers=(Microsoft.App Microsoft.ContainerRegistry Microsoft.Storage)

          for provider in "${providers[@]}"; do
            state=$(az provider show --namespace "$provider" --query registrationState -o tsv 2>/dev/null || true)
            echo "$provider initial state: ${state:-unknown}"

            if [ "$state" != "Registered" ]; then
              echo "Registering $provider..."
              if ! az provider register --namespace "$provider" --wait; then
                echo "::error::Unable to register $provider. The GitHub deployment identity may need subscription-level permission for Microsoft.Resources/subscriptions/providers/register/action, or the provider can be registered once by a subscription administrator."
                exit 1
              fi
            fi

            state=$(az provider show --namespace "$provider" --query registrationState -o tsv)
            if [ "$state" != "Registered" ]; then
              echo "::error::$provider is not Registered (state: $state)."
              exit 1
            fi

            echo "$provider: Registered"
          done

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Deploy/update Azure infrastructure
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME="amo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Azure deployment: $DEPLOYMENT_NAME"
          OUTPUT=$(az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              namePrefix="${{ vars.AMO_AZURE_NAME_PREFIX }}" \
              allowedOrigin="${{ vars.AMO_ALLOWED_ORIGIN }}" \
            --query properties.outputs \
            -o json)

          echo "acr_name=$(echo "$OUTPUT" | jq -r '.acrName.value')" >> "$GITHUB_OUTPUT"
          echo "acr_server=$(echo "$OUTPUT" | jq -r '.acrLoginServer.value')" >> "$GITHUB_OUTPUT"
          echo "container_app=$(echo "$OUTPUT" | jq -r '.containerAppName.value')" >> "$GITHUB_OUTPUT"
          echo "container_app_fqdn=$(echo "$OUTPUT" | jq -r '.containerAppFqdn.value')" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ steps.infra.outputs.acr_name }}"

      - name: Build and push versioned API image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.infra.outputs.acr_server }}/${IMAGE_NAME}:${{ github.sha }}"
          docker build -f server/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Configure Container App registry identity
        shell: bash
        run: |
          set -euo pipefail
          az containerapp registry set \
            --name "${{ steps.infra.outputs.container_app }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --server "${{ steps.infra.outputs.acr_server }}" \
            --identity system

      - name: Deploy AMO API image
        run: |
          az containerapp update \
            --name "${{ steps.infra.outputs.container_app }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE"

      - name: Ensure custom API hostname and managed certificate
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.container_app }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"

          echo "Ensuring custom hostname $API_HOSTNAME on $APP"
          az containerapp hostname add \
            --hostname "$API_HOSTNAME" \
            --resource-group "$RG" \
            --name "$APP" || true

          echo "Ensuring managed certificate and TLS binding for $API_HOSTNAME"
          az containerapp hostname bind \
            --hostname "$API_HOSTNAME" \
            --resource-group "$RG" \
            --name "$APP" \
            --environment "$CONTAINER_APP_ENVIRONMENT" \
            --validation-method CNAME

      - name: Smoke test generated API hostname
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ steps.infra.outputs.container_app_fqdn }}/api/info"
          echo "Waiting for $URL"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error "$URL"; then
              echo
              echo "AMO API is responding on generated hostname."
              exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy in time." >&2
          exit 1

      - name: Smoke test custom API hostname
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${API_HOSTNAME}/api/info"
          echo "Waiting for $URL"
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$URL"; then
              echo
              echo "AMO API custom hostname is responding."
              exit 0
            fi
            sleep 10
          done
          echo "Custom API hostname did not become healthy in time." >&2
          exit 1
