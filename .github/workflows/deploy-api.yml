name: AMO · Validate & Deploy

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'infra/**'
      - 'tests/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-api.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'server/**'
      - 'infra/**'
      - 'tests/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-api.yml'
      - 'package.json'
      - '.github/workflows/acceptance.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional commit SHA or tag override; leave blank to promote current Test release'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: amo-api

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || 'test-current') || github.sha }}

      - name: Validate Bicep syntax
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Build API image
        run: docker build -f server/Dockerfile -t amo-api:${{ github.sha }} .

      - name: Validate browser compatibility scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js worker.js; do
            node --check "$file"
          done

      - name: Run Actuals and reporting model tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/actuals-import.test.js
          node tests/reporting-model.test.js

  changes:
    name: Resolve deployment changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.detect.outputs.release_sha }}
      frontend: ${{ steps.detect.outputs.frontend }}
      api: ${{ steps.detect.outputs.api }}
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || 'test-current') || github.sha }}
          fetch-depth: 0

      - name: Detect changed deployment components
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          RELEASE_SHA=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BASE_TAG=prod-current
            TARGET=Production
          else
            BASE_TAG=test-current
            TARGET=Test
          fi

          frontend=false
          api=false
          infra=false

          if BASE_SHA=$(git rev-parse -q --verify "refs/tags/$BASE_TAG^{commit}" 2>/dev/null); then
            echo "Comparing $TARGET release $RELEASE_SHA with $BASE_TAG at $BASE_SHA"
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$RELEASE_SHA")
          else
            echo "$BASE_TAG does not exist yet; performing a full first deployment to $TARGET."
            CHANGED_FILES=''
            frontend=true
            api=true
            infra=true
          fi

          if [ -n "$CHANGED_FILES" ]; then
            echo 'Changed files since last successful release marker:'
            printf '%s\n' "$CHANGED_FILES"
            while IFS= read -r file; do
              case "$file" in
                infra/*)
                  infra=true
                  # Bicep owns the Container App template and can restore the bootstrap image,
                  # so every infrastructure change must be followed by an API image deployment.
                  api=true
                  ;;
                server/*)
                  api=true
                  ;;
                src/*|worker.js|wrangler.jsonc)
                  frontend=true
                  ;;
                .github/workflows/deploy-api.yml)
                  # Pipeline behaviour changed. Exercise application deployment paths without
                  # unnecessarily reconciling Azure infrastructure.
                  frontend=true
                  api=true
                  ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "Deployment plan: frontend=$frontend api=$api infra=$infra"

  deploy-infra:
    name: Deploy infrastructure · ${{ github.event_name == 'workflow_dispatch' && 'Production' || 'Test' }}
    if: github.event_name != 'pull_request' && needs.changes.outputs.infra == 'true'
    needs:
      - validate
      - changes
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'prod-amo' || 'test-amo' }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.release_sha }}

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure required Azure resource providers
        shell: bash
        run: |
          set -euo pipefail
          providers=(Microsoft.App Microsoft.ContainerRegistry Microsoft.Storage Microsoft.DocumentDB)
          for provider in "${providers[@]}"; do
            state=$(az provider show --namespace "$provider" --query registrationState -o tsv 2>/dev/null || true)
            echo "$provider initial state: ${state:-unknown}"
            if [ "$state" != "Registered" ]; then
              az provider register --namespace "$provider" --wait
            fi
            state=$(az provider show --namespace "$provider" --query registrationState -o tsv)
            [ "$state" = "Registered" ] || { echo "::error::$provider is not Registered (state: $state)."; exit 1; }
          done

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --yes

      - name: Deploy/update Azure infrastructure
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME="${{ vars.AMO_AZURE_NAME_PREFIX }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OUTPUT=$(az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              namePrefix="${{ vars.AMO_AZURE_NAME_PREFIX }}" \
              allowedOrigin="${{ vars.AMO_ALLOWED_ORIGIN }}" \
            --query properties.outputs \
            -o json)
          echo "acr_name=$(echo "$OUTPUT" | jq -r '.acrName.value')" >> "$GITHUB_OUTPUT"
          echo "acr_server=$(echo "$OUTPUT" | jq -r '.acrLoginServer.value')" >> "$GITHUB_OUTPUT"
          echo "container_app=$(echo "$OUTPUT" | jq -r '.containerAppName.value')" >> "$GITHUB_OUTPUT"

      - name: Wait for Container App after infrastructure deployment
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.container_app }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          for attempt in {1..60}; do
            state=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.provisioningState -o tsv 2>/dev/null || true)
            echo "Container App provisioning state: ${state:-unknown}"
            if [ "$state" = "Succeeded" ]; then exit 0; fi
            if [ "$state" = "Failed" ]; then exit 1; fi
            sleep 10
          done
          exit 1

      - name: Configure Container App registry identity
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.container_app }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          SERVER="${{ steps.infra.outputs.acr_server }}"
          configured=$(az containerapp registry list --name "$APP" --resource-group "$RG" --query "[?server=='$SERVER'] | length(@)" -o tsv 2>/dev/null || echo 0)
          if [ "$configured" = "0" ]; then
            az containerapp registry set --name "$APP" --resource-group "$RG" --server "$SERVER" --identity system
          fi

      - name: Ensure custom API hostname and managed certificate
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.container_app }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          HOSTNAME="${{ vars.AMO_API_HOSTNAME }}"
          ENVIRONMENT="${{ vars.AMO_AZURE_NAME_PREFIX }}-env"
          az containerapp hostname add --hostname "$HOSTNAME" --resource-group "$RG" --name "$APP" || true
          az containerapp hostname bind \
            --hostname "$HOSTNAME" \
            --resource-group "$RG" \
            --name "$APP" \
            --environment "$ENVIRONMENT" \
            --validation-method CNAME

  deploy-api:
    name: Deploy API · ${{ github.event_name == 'workflow_dispatch' && 'Production' || 'Test' }}
    if: always() && github.event_name != 'pull_request' && needs.validate.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.api == 'true' && (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    needs:
      - validate
      - changes
      - deploy-infra
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'prod-amo' || 'test-amo' }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.release_sha }}

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --yes

      - name: Resolve existing Azure application resources
        id: azure
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ vars.AMO_AZURE_NAME_PREFIX }}-api"
          COMPACT_PREFIX=$(printf '%s' "${{ vars.AMO_AZURE_NAME_PREFIX }}" | tr -d '-')
          ACR_NAME=$(az acr list --resource-group "$RG" --query "[?starts_with(name, '${COMPACT_PREFIX}acr')].name | [0]" -o tsv)
          [ -n "$ACR_NAME" ] || { echo '::error::Could not resolve the AMO Azure Container Registry.'; exit 1; }
          ACR_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          FQDN=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          REPOSITORY_MODE=$(az containerapp show --name "$APP" --resource-group "$RG" --query "properties.template.containers[0].env[?name=='AMO_REPOSITORY'].value | [0]" -o tsv)
          [ -n "$FQDN" ] || { echo '::error::Could not resolve the AMO Container App FQDN.'; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_server=$ACR_SERVER" >> "$GITHUB_OUTPUT"
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "repository_mode=$REPOSITORY_MODE" >> "$GITHUB_OUTPUT"

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ steps.azure.outputs.acr_name }}"

      - name: Build and push versioned API image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.azure.outputs.acr_server }}/${IMAGE_NAME}:${{ needs.changes.outputs.release_sha }}"
          docker build -f server/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy AMO API image
        run: |
          az containerapp update \
            --name "${{ steps.azure.outputs.app }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE" \
            --set-env-vars "AMO_TARGET_STAGE=${{ vars.AMO_TARGET_STAGE }}"

      - name: Wait for Container App after image deployment
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.azure.outputs.app }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          for attempt in {1..60}; do
            state=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.provisioningState -o tsv 2>/dev/null || true)
            echo "Container App provisioning state: ${state:-unknown}"
            if [ "$state" = "Succeeded" ]; then exit 0; fi
            if [ "$state" = "Failed" ]; then exit 1; fi
            sleep 10
          done
          exit 1

      - name: Smoke test generated API hostname
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ steps.azure.outputs.fqdn }}/api/info"
          for attempt in {1..18}; do
            if BODY=$(curl --fail --silent --show-error "$URL"); then
              echo "$BODY" | jq -e --arg mode "${{ steps.azure.outputs.repository_mode }}" '(.product == "AMO") and (($mode != "mongo") or (.storage == "mongodb" and .capabilities.recovery == true and .capabilities.databaseTransactions == true))' > /dev/null
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Smoke test custom API hostname
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ vars.AMO_API_HOSTNAME }}/api/info"
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$URL"; then exit 0; fi
            sleep 10
          done
          exit 1

  deploy-frontend:
    name: Deploy frontend · ${{ github.event_name == 'workflow_dispatch' && 'Production' || 'Test' }}
    if: github.event_name != 'pull_request' && needs.changes.outputs.frontend == 'true'
    needs:
      - validate
      - changes
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'prod-amo' || 'test-amo' }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.release_sha }}

      - name: Deploy Cloudflare Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --name "${{ vars.AMO_CLOUDFLARE_WORKER }}" --var "AMO_TARGET_STAGE:${{ vars.AMO_TARGET_STAGE }}"

      - name: Smoke test frontend
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ vars.AMO_WEB_ORIGIN }}"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error "$URL" > /dev/null; then exit 0; fi
            sleep 10
          done
          exit 1

  record-prod-release:
    name: Record current Production release
    if: always() && github.event_name == 'workflow_dispatch' && needs.validate.result == 'success' && needs.changes.result == 'success' && (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped') && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') && (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    needs:
      - validate
      - changes
      - deploy-infra
      - deploy-api
      - deploy-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout promoted revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.release_sha }}
          fetch-depth: 0

      - name: Move durable Production marker
        shell: bash
        run: |
          set -euo pipefail
          git tag -f prod-current "${{ needs.changes.outputs.release_sha }}"
          git push origin refs/tags/prod-current --force
          echo "Production release recorded at ${{ needs.changes.outputs.release_sha }}"
