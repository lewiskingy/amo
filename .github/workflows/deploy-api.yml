name: Validate and release AMO

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'infra/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-api.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'server/**'
      - 'infra/**'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-api.yml'
      - 'tests/e2e/**'
      - 'package.json'
      - '.github/workflows/acceptance.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Optional commit SHA or tag override; leave blank to promote current Test release'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: amo-api

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || 'test-current') || github.sha }}

      - name: Validate Bicep syntax
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Build API image
        run: docker build -f server/Dockerfile -t amo-api:${{ github.sha }} .

      - name: Validate browser compatibility scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js worker.js; do
            node --check "$file"
          done

  deploy-api:
    name: Deploy API · ${{ github.event_name == 'workflow_dispatch' && 'Production' || 'Test' }}
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'prod-amo' || 'test-amo' }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || 'test-current') || github.sha }}

      - name: Resolve release SHA
        id: release
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA to ${{ github.event_name == 'workflow_dispatch' && 'Production' || 'Test' }}"

      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure required Azure resource providers
        shell: bash
        run: |
          set -euo pipefail
          providers=(Microsoft.App Microsoft.ContainerRegistry Microsoft.Storage Microsoft.DocumentDB)
          for provider in "${providers[@]}"; do
            state=$(az provider show --namespace "$provider" --query registrationState -o tsv 2>/dev/null || true)
            echo "$provider initial state: ${state:-unknown}"
            if [ "$state" != "Registered" ]; then
              az provider register --namespace "$provider" --wait
            fi
            state=$(az provider show --namespace "$provider" --query registrationState -o tsv)
            [ "$state" = "Registered" ] || { echo "::error::$provider is not Registered (state: $state)."; exit 1; }
          done

      - name: Ensure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Deploy/update Azure infrastructure
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_NAME="${{ vars.AMO_AZURE_NAME_PREFIX }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OUTPUT=$(az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters \
              namePrefix="${{ vars.AMO_AZURE_NAME_PREFIX }}" \
              allowedOrigin="${{ vars.AMO_ALLOWED_ORIGIN }}" \
            --query properties.outputs \
            -o json)
          echo "acr_name=$(echo "$OUTPUT" | jq -r '.acrName.value')" >> "$GITHUB_OUTPUT"
          echo "acr_server=$(echo "$OUTPUT" | jq -r '.acrLoginServer.value')" >> "$GITHUB_OUTPUT"
          echo "container_app=$(echo "$OUTPUT" | jq -r '.containerAppName.value')" >> "$GITHUB_OUTPUT"
          echo "container_app_fqdn=$(echo "$OUTPUT" | jq -r '.containerAppFqdn.value')" >> "$GITHUB_OUTPUT"
          echo "repository_mode=$(echo "$OUTPUT" | jq -r '.repositoryMode.value')" >> "$GITHUB_OUTPUT"

      - name: Wait for Container App after infrastructure deployment
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.container_app }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          for attempt in {1..60}; do
            state=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.provisioningState -o tsv 2>/dev/null || true)
            echo "Container App provisioning state: ${state:-unknown}"
            if [ "$state" = "Succeeded" ]; then exit 0; fi
            if [ "$state" = "Failed" ]; then exit 1; fi
            sleep 10
          done
          exit 1

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ steps.infra.outputs.acr_name }}"

      - name: Build and push versioned API image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.infra.outputs.acr_server }}/${IMAGE_NAME}:${{ steps.release.outputs.sha }}"
          docker build -f server/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Configure Container App registry identity
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.container_app }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          SERVER="${{ steps.infra.outputs.acr_server }}"
          configured=$(az containerapp registry list --name "$APP" --resource-group "$RG" --query "[?server=='$SERVER'] | length(@)" -o tsv 2>/dev/null || echo 0)
          if [ "$configured" = "0" ]; then
            az containerapp registry set --name "$APP" --resource-group "$RG" --server "$SERVER" --identity system
          fi

      - name: Wait for Container App after registry configuration
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.container_app }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          for attempt in {1..60}; do
            state=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.provisioningState -o tsv 2>/dev/null || true)
            echo "Container App provisioning state: ${state:-unknown}"
            if [ "$state" = "Succeeded" ]; then exit 0; fi
            if [ "$state" = "Failed" ]; then exit 1; fi
            sleep 10
          done
          exit 1

      - name: Deploy AMO API image
        run: |
          az containerapp update \
            --name "${{ steps.infra.outputs.container_app }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$IMAGE" \
            --set-env-vars "AMO_TARGET_STAGE=${{ vars.AMO_TARGET_STAGE }}"

      - name: Wait for Container App after image deployment
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.container_app }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          for attempt in {1..60}; do
            state=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.provisioningState -o tsv 2>/dev/null || true)
            echo "Container App provisioning state: ${state:-unknown}"
            if [ "$state" = "Succeeded" ]; then exit 0; fi
            if [ "$state" = "Failed" ]; then exit 1; fi
            sleep 10
          done
          exit 1

      - name: Ensure custom API hostname and managed certificate
        shell: bash
        run: |
          set -euo pipefail
          APP="${{ steps.infra.outputs.container_app }}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          HOSTNAME="${{ vars.AMO_API_HOSTNAME }}"
          ENVIRONMENT="${{ vars.AMO_AZURE_NAME_PREFIX }}-env"
          az containerapp hostname add --hostname "$HOSTNAME" --resource-group "$RG" --name "$APP" || true
          az containerapp hostname bind \
            --hostname "$HOSTNAME" \
            --resource-group "$RG" \
            --name "$APP" \
            --environment "$ENVIRONMENT" \
            --validation-method CNAME

      - name: Smoke test generated API hostname
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ steps.infra.outputs.container_app_fqdn }}/api/info"
          for attempt in {1..18}; do
            if BODY=$(curl --fail --silent --show-error "$URL"); then
              echo "$BODY" | jq -e --arg mode "${{ steps.infra.outputs.repository_mode }}" '(.product == "AMO") and (($mode != "mongo") or (.storage == "mongodb" and .capabilities.recovery == true and .capabilities.databaseTransactions == true))' > /dev/null
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Smoke test custom API hostname
        shell: bash
        run: |
          set -euo pipefail
          URL="https://${{ vars.AMO_API_HOSTNAME }}/api/info"
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "$URL"; then exit 0; fi
            sleep 10
          done
          exit 1

  deploy-frontend:
    name: Deploy frontend · ${{ github.event_name == 'workflow_dispatch' && 'Production' || 'Test' }}
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'prod-amo' || 'test-amo' }}
    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || 'test-current') || github.sha }}

      - name: Resolve release SHA
        shell: bash
        run: echo "Deploying $(git rev-parse HEAD) to ${{ github.event_name == 'workflow_dispatch' && 'Production' || 'Test' }}"

      - name: Deploy Cloudflare Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --name "${{ vars.AMO_CLOUDFLARE_WORKER }}" --var "AMO_TARGET_STAGE:${{ vars.AMO_TARGET_STAGE }}"

      - name: Smoke test frontend
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ vars.AMO_WEB_ORIGIN }}"
          for attempt in {1..18}; do
            if curl --fail --silent --show-error "$URL" > /dev/null; then exit 0; fi
            sleep 10
          done
          exit 1

  mark-test-release:
    name: Record current Test release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - deploy-api
      - deploy-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Move durable Test marker
        shell: bash
        run: |
          set -euo pipefail
          git tag -f test-current "${{ github.sha }}"
          git push origin refs/tags/test-current --force
          echo "Test release recorded at ${{ github.sha }}"
